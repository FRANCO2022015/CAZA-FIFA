name: Verify CAZA
on:
  push:
    branches: [main, codex/preparacion-nube, fifa]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
        working-directory: caza-backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: caza-frontend/package-lock.json
      - run: npm ci
        working-directory: caza-frontend
      - run: npm run build
        working-directory: caza-frontend
