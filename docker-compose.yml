# Opción para ejecutar el backend con una base ya restaurada.
# Requiere variables del ejemplo caza-backend/.env.example en tu entorno.
# No inicia una base vacía ni ejecuta seeds.
services:
  backend:
    build: ./caza-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Configura la URL JDBC}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Configura el rol}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Configura la clave}
      APPLICATION_JWT_SECRET: ${APPLICATION_JWT_SECRET:?Configura un secreto aleatorio}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Configura el frontend}
      CLOUD_ADMIN_EMAIL: ${CLOUD_ADMIN_EMAIL:-admin@caza.com}
      CLOUD_ADMIN_PASSWORD: ${CLOUD_ADMIN_PASSWORD:?Configura una clave nueva}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?Configura Cloudinary}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?Configura Cloudinary}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?Configura Cloudinary}
