server:
  port: ${PORT:8080}
spring:
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/EFOOTBALL}
    username: ${SPRING_DATASOURCE_USERNAME:caza_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
application:
  jwt:
    secret: ${APPLICATION_JWT_SECRET:}
    expiration: ${APPLICATION_JWT_EXPIRATION:86400000}
  registration-enabled: ${REGISTRATION_ENABLED:false}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  uploads:
    provider: ${UPLOAD_PROVIDER:local}
    directory: ${UPLOAD_DIRECTORY:uploads/players}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
