spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: validate
server:
  tomcat:
    threads:
      max: 20
      min-spare: 2
application:
  cors-origins: ${CORS_ALLOWED_ORIGINS}
  uploads:
    provider: cloudinary
  jwt:
    secret: ${APPLICATION_JWT_SECRET}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
